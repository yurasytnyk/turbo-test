name: Release
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  packages: write
  pull-requests: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug - Check token (first/last 4 chars)
        run: |
          echo "Token starts with: ${GITHUB_TOKEN:0:4}"
          echo "Token ends with: ${GITHUB_TOKEN: -4}"
          echo "Token length: ${#GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Check npm config before .npmrc creation
        run: |
          echo "=== NPM Config ==="
          npm config list
          echo "=== PNPM Config ==="
          pnpm config list

      - name: Create .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
          //npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Check .npmrc content (masked)
        run: |
          echo "=== .npmrc location ==="
          ls -la $HOME/.npmrc
          echo "=== .npmrc content (token will be masked) ==="
          cat $HOME/.npmrc

      - name: Debug - Test authentication
        run: |
          echo "Testing auth with npm whoami..."
          npm whoami --registry=https://npm.pkg.github.com/ || echo "npm whoami failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: update versions"
          title: "chore: update versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
